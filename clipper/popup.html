<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{
  --accent:#E8467F; --accent-soft:#FDECF3; --purple:#8B5CF6;
  --ink:#2B2536; --ink-2:#6B6280; --ink-3:#9A93AC;
  --surface:#FFF; --surface-2:#F7F4FA; --line:#EDE7F3;
  --ok:#22A585; --warn:#DE8A18;
  --sans:"Poppins",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{width:340px;margin:0;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:linear-gradient(150deg,#FDE0C8 0%,#F9CBDD 50%,#DCC6F5 100%);padding:14px}
.card{background:var(--surface);border-radius:16px;padding:16px;
  box-shadow:0 2px 4px rgba(80,50,110,.05),0 14px 30px -16px rgba(80,50,110,.3)}
h1{font-size:14px;font-weight:700;margin:0 0 3px}
.sub{font-size:11px;color:var(--ink-3);margin:0 0 14px;font-family:var(--mono)}
button.go{width:100%;padding:11px;border:none;border-radius:20px;background:var(--accent);
  color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s}
button.go:hover:not(:disabled){transform:translateY(-1px)}
button.go:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:12px;line-height:1.6;color:var(--ink-2)}
.msg.err{color:var(--accent)}
.preview{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:none}
.preview.on{display:block}
.pt{font-weight:600;font-size:13px;line-height:1.4;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.pill{font-family:var(--mono);font-size:10px;padding:2.5px 8px;border-radius:12px;
  background:var(--surface-2);color:var(--ink-2)}
.pill.hi{background:var(--accent-soft);color:var(--accent);font-weight:600}
.body{font-size:11.5px;color:var(--ink-2);line-height:1.55;max-height:90px;overflow:auto;
  background:var(--surface-2);padding:9px 11px;border-radius:10px;white-space:pre-wrap}
.warn{margin-top:9px;font-size:11px;color:var(--warn);line-height:1.5}
.done{margin-top:11px;font-size:11.5px;color:var(--ok);font-weight:600}
.path{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:3px;word-break:break-all}
.more{display:block;margin-top:12px;font-size:11.5px;color:var(--ink-2);text-decoration:none;text-align:center}
.more:hover{color:var(--accent)}
</style></head>
<body>
  <div class="card">
    <h1 id="title">采集当前笔记</h1>
    <p class="sub">→ ~/Downloads/xhs-inbox/</p>
    <button class="go" id="go">抓取这一篇</button>
    <div class="msg" id="msg"></div>
    <div class="preview" id="preview"></div>
  </div>
  <a class="more" id="batch" href="#">依次更新对标账号 · 实验功能</a>
  <script src="popup.js"></script>
</body></html>
