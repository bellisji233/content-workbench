<meta charset="utf-8">
<title>内容工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --g1:#FDE0C8; --g2:#F9CBDD; --g3:#DCC6F5;
  --surface:#FFF; --surface-2:#F7F4FA; --surface-3:#EDE7F3;
  --ink:#2B2536; --ink-2:#6B6280; --ink-3:#9A93AC;
  --line:#EDE7F3; --line-2:#DCD3E8;
  --accent:#E8467F; --accent-soft:#FDECF3;
  --orange:#F79245; --orange-soft:#FEF0E4;
  --purple:#8B5CF6; --purple-soft:#F1ECFE;
  --ok:#22A585; --ok-soft:#E3F6F1; --warn:#DE8A18; --warn-soft:#FDF2E0;
  --grey:#9A93AC;
  --c-rb:#E8467F; --c-dy:#8B5CF6;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --sh:0 2px 4px rgba(80,50,110,.04), 0 14px 34px -18px rgba(80,50,110,.22);
  --sh-lift:0 4px 10px rgba(80,50,110,.07), 0 22px 46px -20px rgba(80,50,110,.3);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Poppins","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --disp:"Poppins","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --g1:#2A1E33; --g2:#301E36; --g3:#241D3D;
  --surface:#1C1726; --surface-2:#241E30; --surface-3:#2F2740;
  --ink:#F0EBF7; --ink-2:#ADA3C0; --ink-3:#7D7391;
  --line:#2F2740; --line-2:#3D3352;
  --accent:#F04D85; --accent-soft:#3A1B2A;
  --orange:#F0A868; --orange-soft:#3A2A1B;
  --purple:#8F72EC; --purple-soft:#251E3E;
  --ok:#3FC3A0; --ok-soft:#14302A; --warn:#E0A040; --warn-soft:#332614;
  --grey:#8A80A0;
  --c-rb:#F04D85; --c-dy:#8F72EC;
  --sh:0 2px 4px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.7);
  --sh-lift:0 4px 10px rgba(0,0,0,.4), 0 22px 46px -20px rgba(0,0,0,.8);
}}
:root[data-theme=dark]{
  --g1:#2A1E33; --g2:#301E36; --g3:#241D3D;
  --surface:#1C1726; --surface-2:#241E30; --surface-3:#2F2740;
  --ink:#F0EBF7; --ink-2:#ADA3C0; --ink-3:#7D7391;
  --line:#2F2740; --line-2:#3D3352;
  --accent:#F04D85; --accent-soft:#3A1B2A;
  --orange:#F0A868; --orange-soft:#3A2A1B;
  --purple:#8F72EC; --purple-soft:#251E3E;
  --ok:#3FC3A0; --ok-soft:#14302A; --warn:#E0A040; --warn-soft:#332614;
  --grey:#8A80A0;
  --c-rb:#F04D85; --c-dy:#8F72EC;
  --sh:0 2px 4px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.7);
  --sh-lift:0 4px 10px rgba(0,0,0,.4), 0 22px 46px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background:var(--g2);
  background-image:
    radial-gradient(120% 90% at 0% 0%, var(--g1) 0%, transparent 55%),
    radial-gradient(110% 100% at 100% 100%, var(--g3) 0%, transparent 58%),
    linear-gradient(140deg, var(--g1) 0%, var(--g2) 48%, var(--g3) 100%);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:228px 1fr;gap:20px;
  max-width:1420px;margin:0 auto;padding:20px}
.side{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);
  padding:24px 0 20px;position:sticky;top:20px;align-self:start;
  max-height:calc(100vh - 40px);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:0 22px 20px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.brand .bt{font-family:var(--disp);font-size:16px;font-weight:700;line-height:1.3;
  letter-spacing:-.01em}
.brand .bs{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:3px;padding:0 12px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
  font-size:13.5px;color:var(--ink-2);text-align:left;width:100%;transition:all .15s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent);color:#fff;font-weight:600;
  box-shadow:0 6px 16px -6px var(--accent)}
.nav .ico{width:16px;text-align:center;flex:none;font-size:12px;opacity:.75}
.nav button.on .ico{opacity:1}
.nav .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1.5px 7px;
  border-radius:20px;background:var(--accent);color:#fff;font-weight:600}
.nav button.on .bdg{background:rgba(255,255,255,.28);color:#fff}
.nav .bdg.mute{background:var(--surface-3);color:var(--ink-3)}
.nav button.on .bdg.mute{background:rgba(255,255,255,.28);color:#fff}
.navgroup{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);padding:16px 12px 6px}
.navgroup:first-child{padding-top:2px}
.side-foot{margin-top:auto;padding:18px 22px 0}

.main{min-width:0;padding-bottom:50px}
.vhead{margin-bottom:22px;padding:2px 4px}
.vhead h1{font-family:var(--disp);font-size:28px;font-weight:700;margin:0 0 6px;
  line-height:1.25;letter-spacing:-.02em}
.vhead p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:72ch}
.vhead code{font-family:var(--mono);font-size:.86em;background:var(--surface);
  padding:2px 7px;border-radius:6px}

/* ============ panels ============ */
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);
  overflow:hidden;margin-bottom:18px}
.panel-h{padding:17px 22px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h2{font-family:var(--disp);font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.panel-h .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.panel-b{padding:6px 22px 20px}
.panel-b.flush{padding:0 0 6px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:14px;margin-bottom:18px}
.tile{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh);
  padding:18px 20px}
.tile .n{font-family:var(--disp);font-size:29px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;display:block;letter-spacing:-.02em}
.tile .n em{font-style:normal;font-size:14px;color:var(--ink-3);font-weight:500}
.tile .l{font-size:12px;color:var(--ink-2);display:block;margin-top:6px;line-height:1.45}
.tile.soft .n{color:var(--accent)}
.tile.soft{background:var(--accent-soft)}
.tile.bad{background:linear-gradient(145deg,#F5578C,#E8467F);box-shadow:0 12px 28px -12px rgba(232,70,127,.6)}
.tile.bad .n,.tile.bad .l{color:#fff}
.tile.bad .l{opacity:.9}
.tile.good{background:linear-gradient(145deg,#FBA85C,#F79245);box-shadow:0 12px 28px -12px rgba(247,146,69,.6)}
.tile.good .n,.tile.good .l{color:#fff}
.tile.good .l{opacity:.9}

/* ============ rows ============ */
.rows{display:flex;flex-direction:column}
.rowhead{padding-top:4px;padding-bottom:9px;font-family:var(--mono);font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);cursor:default}
.rowhead:hover{background:none}
.rowhead .r-side{justify-content:flex-end}
.sth{flex:1;text-align:center;font-family:var(--sans);font-size:10px;letter-spacing:0;
  text-transform:none;color:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);font-weight:400}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.row{display:grid;grid-template-columns:1fr 210px 172px;gap:16px;align-items:center;
  padding:12px 22px;transition:background .15s}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row.flag{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.row.selectable{cursor:pointer}
.row.selectable:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.r-main{min-width:0}
a.r-link{color:inherit;text-decoration:none;display:block}
a.r-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
a.r-acc{color:inherit;text-decoration:none}
a.r-acc:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.r-t{font-size:13.5px;font-weight:600;line-height:1.4;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.r-p{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:block;
  margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}
.r-note{font-size:11.5px;color:var(--accent);display:block;margin-top:4px;font-weight:500}
.r-perf{font-family:var(--mono);font-size:10.5px;color:var(--ok);display:block;
  margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stages{display:flex;gap:4px;align-items:center;min-width:0}
.st{flex:1;height:24px;border-radius:7px;background:var(--surface-3);display:flex;
  align-items:center;justify-content:center;font-family:var(--sans);font-size:11px;
  color:var(--ink-3);font-weight:500}
.st.done{background:var(--ok);color:#fff}
.st.miss{background:var(--accent);color:#fff}
.meta-cell{display:flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:11px;color:var(--ink-3)}
.wc{flex:1;font-variant-numeric:tabular-nums}
.chip,.plat{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;
  background:var(--surface-3);color:var(--ink-3);white-space:nowrap}
.chip.p0.on,.plat.on:first-of-type{background:var(--accent-soft);color:var(--c-rb);font-weight:600}
.chip.p1.on{background:var(--purple-soft);color:var(--c-dy);font-weight:600}
.chip.p2.on{background:var(--orange-soft);color:var(--orange);font-weight:600}
.chip.p3.on{background:var(--ok-soft);color:var(--ok);font-weight:600}
.plat.on{background:var(--purple-soft);color:var(--c-dy);font-weight:600}

/* status control */
.r-side{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.stat-btn{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;
  background:var(--surface-2);font-size:12px;font-weight:600;white-space:nowrap;
  transition:all .15s}
.stat-btn:hover{background:var(--surface-3);transform:translateY(-1px)}
.stat-btn .dot{width:7px;height:7px;border-radius:50%;flex:none}
.stat-btn .car{font-size:9px;opacity:.55}
.s-red{color:var(--accent)} .s-red .dot{background:var(--accent)}
.s-amber{color:var(--warn)} .s-amber .dot{background:var(--warn)}
.s-green{color:var(--ok)} .s-green .dot{background:var(--ok)}
.s-blue{color:var(--purple)} .s-blue .dot{background:var(--purple)}
.s-grey{color:var(--grey)} .s-grey .dot{background:var(--grey)}
.idle{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;
  min-width:50px;text-align:right}

/* menu */
.menu{position:fixed;z-index:60;background:var(--surface);border-radius:var(--r-md);
  box-shadow:var(--sh-lift);padding:7px;min-width:184px;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;
  border-radius:10px;font-size:13px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu .dot{width:7px;height:7px;border-radius:50%;flex:none}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 4px}
.menu .hint{font-size:10.5px;color:var(--ink-3);padding:5px 12px 6px;line-height:1.5}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:flex;background:var(--surface);border-radius:20px;padding:4px;box-shadow:var(--sh)}
.seg button{padding:6px 15px;border-radius:16px;font-size:12.5px;color:var(--ink-2);
  font-weight:500;transition:all .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.segn{font-family:var(--mono);font-size:10px;margin-left:6px;opacity:.6}
.seg button.on .segn{opacity:.85}
.search{flex:1;min-width:160px;max-width:300px;padding:9px 16px;border:none;
  border-radius:20px;background:var(--surface);color:var(--ink);font-size:13px;
  font-family:var(--sans);box-shadow:var(--sh)}
.search::placeholder{color:var(--ink-3)}

/* 长列表：显示全部、版本切换、左右分栏 */
.new-chip{display:inline-block;margin-right:7px;padding:1px 7px;vertical-align:1px;
  background:var(--accent-soft);color:var(--accent);font-weight:600}
a.r-link.inl{display:inline}
.more-row{display:block;width:100%;padding:12px;border:none;border-top:1px solid var(--line);
  background:none;color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer}
.more-row:hover{color:var(--accent);background:var(--surface-2)}
.ver{display:inline-flex;align-items:center;gap:5px;margin-left:auto}
.ver-b{width:28px;height:28px;border:none;border-radius:50%;background:var(--surface-2);
  color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer}
.ver-b:hover:not(:disabled){color:var(--accent)}
.ver-b:disabled{opacity:.35;cursor:default}
.ver-sw{position:relative;display:inline-flex}
.ver-sw::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font-size:9px;color:var(--ink-3);pointer-events:none}
.ver-s{-webkit-appearance:none;appearance:none;font-family:var(--mono);font-size:12px;
  padding:6px 28px 6px 13px;border:none;border-radius:14px;background:var(--surface-2);
  color:var(--ink);cursor:pointer;max-width:240px;height:28px;line-height:16px}
.ver-s:hover{background:var(--surface-3)}
.ver-meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:0 0 12px}
.split{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;align-items:start}
.split>.panel{margin-bottom:0}
.list-pane{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.lp-tools{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.lp-tools .search{max-width:none;min-width:0;background:var(--surface-2);box-shadow:none}
.panel-h .seg{box-shadow:none;background:var(--surface-2)}
.panel-h .seg button{padding:4px 12px}
.panel-h .search{box-shadow:none;background:var(--surface-2);padding:6px 14px;max-width:220px;min-width:120px}
.lp-tools .seg{box-shadow:none;background:var(--surface-2);flex-wrap:wrap}
.lp-tools .seg button{padding:5px 11px}
.list-pane .rows{overflow-y:auto;min-height:0;border-top:1px solid var(--line)}
.list-pane .row{grid-template-columns:1fr !important;padding:11px 16px;gap:4px}
.list-pane .r-t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list-pane .r-p{white-space:normal}
@media(max-width:1100px){
  .split{grid-template-columns:1fr}
  .list-pane{position:static;max-height:440px;margin-bottom:18px!important}
}

/* callout */
.call{background:var(--surface);border-radius:var(--r-md);padding:18px 22px;
  margin-bottom:18px;font-size:13.5px;box-shadow:var(--sh);
  border-left:5px solid var(--accent)}
.call.warn{border-left-color:var(--orange)}
.call.info{border-left-color:var(--purple)}
.call h3{margin:0 0 8px;font-family:var(--disp);font-size:14.5px;font-weight:700}
.call p{margin:0 0 8px;color:var(--ink-2)}
.call p:last-child{margin:0}
.call code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);
  padding:2px 7px;border-radius:6px}
.call ul{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
.call li{margin-bottom:5px}
.call strong{color:var(--ink)}

/* charts */
.chart-wrap{overflow-x:auto}
svg.chart{display:block;width:100%;height:auto;font-family:var(--sans)}
.ax-line{stroke:var(--line-2);stroke-width:1}
.grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.ax-t{fill:var(--ink-3);font-size:10px;font-family:var(--mono)}
.ax-title{fill:var(--ink-2);font-size:11px;font-weight:500}
.pt{stroke:var(--surface);stroke-width:2.5;cursor:pointer;transition:r .12s}
.pt:hover{r:8}
.dlab{fill:var(--ink-2);font-size:10px;font-weight:500;
  paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.legend2{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend2 span{display:flex;align-items:center;gap:7px}
.legend2 i{width:10px;height:10px;border-radius:50%;display:block}
.tip{position:fixed;z-index:70;background:var(--surface);border-radius:var(--r-sm);
  box-shadow:var(--sh-lift);padding:10px 13px;font-size:12px;pointer-events:none;
  display:none;max-width:250px}
.tip.on{display:block}
.tip .tt{font-weight:700;margin-bottom:6px;line-height:1.35}
.tip .tr{font-family:var(--mono);font-size:11px;color:var(--ink-2);
  display:flex;justify-content:space-between;gap:16px}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px;padding-top:4px}
.brow{display:grid;grid-template-columns:1fr 160px 56px;gap:14px;align-items:center}
.blab{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.blab em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-3);
  display:block;margin-top:2px;font-weight:400}
.btrack{height:10px;background:var(--surface-3);border-radius:20px;overflow:hidden}
.bfill{height:100%;border-radius:20px}
.bval{font-family:var(--mono);font-size:12px;text-align:right;
  font-variant-numeric:tabular-nums;font-weight:500}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:620px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:11px 22px;
  background:var(--surface-2);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:11px 22px;vertical-align:middle}
tbody tr+tr td{border-top:1px solid var(--line)}
td.r,td.d{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.d{color:var(--ink-2)}
tbody tr:hover{background:var(--surface-2)}

th.sort{padding:0}
th.sort button{display:flex;align-items:center;gap:4px;width:100%;padding:11px 22px;
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;white-space:nowrap}
th.sort.r button{justify-content:flex-end}
th.sort button:hover{color:var(--ink)}
th.sort[aria-sort] button{color:var(--accent);font-weight:600}
th.sort .ar{font-size:9px;width:8px;text-align:center}
.del-b{display:inline-flex;align-items:center;justify-content:center;flex:none;
  height:28px;padding:0 10px;border-radius:14px;font-size:12px;color:var(--ink-3);
  white-space:nowrap;transition:background .15s,color .15s,opacity .15s}
.del-b:hover{background:var(--accent-soft);color:var(--accent)}
.row .del-b.hov{opacity:0}
.row:hover .del-b.hov,.row:focus-within .del-b.hov{opacity:1}
@media(hover:none){.row .del-b.hov{opacity:1}}
.ext-a{font-size:11.5px;color:var(--ink-3);text-decoration:none;white-space:nowrap}
.ext-a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DATA = __WORKBENCH_DATA__;
const WB_URL = DATA.workbenchUrl || "";

/* ---------- 运行环境 ----------
   线上（claude.ai）：存储 db、分析 sample、保存 downloads 由平台提供。
   本地服务（scripts/serve.py）：同样三项由本机服务提供，接口形状一致，下面的代码不用分两套。
   直接双击打开的静态文件：三项都没有，只读。 */
const LOCAL = DATA.localApi || null;

function api(path, opts = {}){
  return fetch(path, { ...opts, headers: { "X-Workbench-Token": LOCAL.token,
    "Content-Type": "application/json", ...(opts.headers || {}) } });
}

async function apiOk(path, opts){
  const r = await api(path, opts);
  if (!r.ok){
    let msg = `本机服务返回 ${r.status}`;
    try { const j = await r.clone().json(); if (j.error) msg = j.error; } catch(e){ /* 不是 JSON 就用状态码 */ }
    throw new Error(msg);
  }
  return r;
}

function localDb(){
  const doc = path => ({
    set: data => apiOk(`/api/db/${path}`, { method: "PUT", body: JSON.stringify(data) }),
    delete: () => apiOk(`/api/db/${path}`, { method: "DELETE" }),
  });
  return {
    doc,
    collection: name => ({ get: async () => {
      const { docs } = await (await apiOk(`/api/db/${name}`)).json();
      return { docs: docs.map(d => ({ id: d.id, data: () => d.data })) };
    }}),
  };
}

/** 和平台的 sample 同样的调用方式：流式回调 onText，中止抛 code=cancelled，失败带上已生成的部分。 */
async function localSample(input, { signal, onText } = {}){
  let text = "";
  const cancelled = () => Object.assign(new Error("cancelled"), { code: "cancelled", text });
  try {
    const r = await apiOk("/api/sample", { method: "POST", body: JSON.stringify({ prompt: input }), signal });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const m = JSON.parse(line);
        if (m.error) throw Object.assign(new Error(m.error), { text });
        if (m.t){ text += m.t; if (onText) onText({ text }); }
      }
    }
  } catch(e){
    if (e.name === "AbortError") throw cancelled();
    if (e.text === undefined) e.text = text;
    throw e;
  }
  return { text };
}

const localDownloads = {
  save: async ({ data }) => (await apiOk("/api/export", { method: "POST", body: data })).json(),
};
let dbReady = false;   // db 解析完毕（无论成败）；解析前不能断言「读不到」

/** 按字符截断。slice 按 UTF-16 码元切，emoji 会被劈成半个码位，显示成乱码方块。 */
function cut(str, n){
  const a = Array.from(String(str||""));
  return a.length > n ? a.slice(0, n).join("") + "…" : a.join("");
}

/* ---------- 状态定义 ---------- */
// 默认状态 + 配置里的自定义状态（local/config.toml 的 [status] extra）
const STATUSES = [
  ["生产中","amber"],["待发布","amber"],["已发布","green"],
  ["主动停掉","grey"],["效果不好","grey"],
  ...(DATA.statusExtra || []),
  ["归档","grey"],["未发布","red"],["?","red"],
];
const STYLE = Object.fromEntries(STATUSES);
// "?" 是「推断不出来」的内部占位值，界面上显示成人话
const STATUS_LABEL = {"?": "待确认"};
const statusText = s => STATUS_LABEL[s] || s;
const STAGE_LABELS = Object.fromEntries((DATA.stages || []).map(s => [s.key, s.label]));
const STAGES_ORDER = Object.entries(STAGE_LABELS);
const PLAT_PALETTE = ["var(--c-rb)", "var(--c-dy)", "var(--orange)", "var(--ok)", "var(--warn)"];
const PLAT_COLOR = Object.fromEntries(
  DATA.platforms.map((p, i) => [p.name, PLAT_PALETTE[i % PLAT_PALETTE.length]]));

/* 稳定短 id：doc_id 只接受 ASCII，中文 key 必须编码 */
function keyId(k){
  let h = 2166136261;
  for (let i=0;i<k.length;i++){ h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); }
  return "k" + (h>>>0).toString(16).padStart(8,"0");
}

/* ---------- 运行时状态 ---------- */
let db = null;
const queuedOps = [];          // 待写远端的操作描述（可序列化，能跨刷新）
let saveError = null;
const overrides = {};          // keyId -> {status, note}

/* 本地镜像：刷新后立刻可用，也兜住远端存储连不上的情况。
   远端是共享真相源，本地只是副本 —— 两边都有时以远端为准。 */
const LS = "workbench.v1";

/* 看过的近期爆款（账号 + 标题）。待办只数没看过的，打开「近期爆款」后清零 */
const seenHot = new Set();
const dbKeys = new Set();     // 上次从数据库读到的分析记录 id，用来认出在别处删掉的
const freshHot = new Set();   // 这次打开页面时才看到的，「新」标记保留到刷新页面
const hotKey = n => (n.userId || n.account) + "|" + n.title;
function unseenHot(){
  const B = (DATA.benchmark || {}).summary;
  return B ? B.candidates.filter(n => !seenHot.has(hotKey(n))).length : 0;
}

function saveLocal(){
  try {
    localStorage.setItem(LS, JSON.stringify({
      overrides, analyses, seenHot: [...seenHot].slice(-500), dbKeys: [...dbKeys],
      queued: queuedOps,          // 还没写进远端的改动，刷新后继续补
    }));
  } catch(e){ /* 隐私模式或存储被禁，降级为仅本次会话有效 */ }
}

function loadLocal(){
  try {
    const raw = localStorage.getItem(LS);
    if (!raw) return;
    const v = JSON.parse(raw);
    Object.assign(overrides, v.overrides || {});
    // 旧版本把选题推荐存成了 n_topics_* 的重复 key，读入时丢掉
    (v.seenHot || []).forEach(k => seenHot.add(k));
    (v.dbKeys || []).forEach(k => dbKeys.add(k));
    Object.entries(v.analyses || {}).forEach(([k, a]) => {
      if (!k.startsWith("n_topics_")) analyses[k] = a;
    });
    if (Array.isArray(v.queued)) queuedOps.push(...v.queued);
  } catch(e){ /* 存的内容坏了就当没有，不阻断启动 */ }
}

/** 所有写库都走这里：未就绪先排队，失败要留痕，不能静默丢。 */
async function applyOp(d, op){
  if (op.kind === "del") return d.doc(op.path).delete();
  return d.doc(op.path).set(op.data);
}

async function persist(op){
  queuedOps.push(op);
  saveLocal();                    // 先落本地，远端失败也不丢
  if (!db){ updateSync(); return; }
  await flushQueued();
}

async function flushQueued(){
  if (!db || !queuedOps.length){ updateSync(); return; }
  const batch = queuedOps.splice(0);
  const failed = [];
  for (const op of batch){
    try { await applyOp(db, op); }
    catch(e){ failed.push(op); saveError = (e && (e.message || e.code)) || String(e); }
  }
  if (failed.length) queuedOps.push(...failed);
  else saveError = null;
  saveLocal();
  updateSync();
}

function updateSync(){
  const pill = document.getElementById("syncPill");
  const txt = document.getElementById("syncTxt");
  if (!pill || !txt) return;
  if (saveError){ pill.className = "sync off"; txt.textContent = "保存失败：" + saveError; }
  else if (!db && queuedOps.length){
    pill.className = "sync off"; txt.textContent = `${queuedOps.length} 项仅存本地`; }
  else if (!db){ pill.className = "sync off"; txt.textContent = "只读副本"; }
  else if (queuedOps.length){
    pill.className = "sync"; txt.textContent = "同步中"; }
  else { pill.className = "sync live"; txt.textContent = "已保存"; }
}
const items = DATA.items;
items.forEach(it => it.id = keyId(it.key));

/** 全部发布记录，去重：同一条发布可能同时被流水线和稿件两边认领 */
function allPubs(){
  const seen = new Set();
  return items.flatMap(i=>i.pubs).concat(DATA.orphans).filter(p => {
    const k = p.platform + "|" + p.title + "|" + p.date;
    return seen.has(k) ? false : (seen.add(k), true);
  });
}

// 页面上手动标的「还没发」一类状态，之后出现了发布记录（发布日期晚于标记）就以数据为准
const PRE_PUBLISH = new Set(["?","生产中","待发布","未发布","主动停掉","效果不好"]);
const lastPubDate = it => (it.pubs || []).reduce((m, p) => p.date && p.date > m ? p.date : m, "");
function effective(it){
  const o = overrides[it.id];
  if (!o || !o.status) return it.status;
  const pub = lastPubDate(it);
  if (pub && PRE_PUBLISH.has(o.status) && (!o.at || pub > o.at.slice(0, 10))) return "已发布";
  return o.status;
}
const effNote   = it => overrides[it.id]?.note ?? it.note;

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c;
  if(h!==undefined)n.innerHTML=h; return n; };
const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt = n => (n??0).toLocaleString("en-US");

function analyzedIds(){
  const s = new Set();
  Object.values(analyses).forEach(a => (a.ids || []).forEach(id => s.add(id)));
  return s;
}

/** 采集箱待办 = 还没进过任何一次分析的笔记。
    进过组合分析也算处理过，之后想再组合随时可以，但不再提醒。 */
function inboxPending(){
  const done = analyzedIds();
  return (DATA.inbox || []).filter(n => !done.has(n.id)).length;
}

  if (slot){ slot.innerHTML = ""; const c = runningCard(); if (c) slot.appendChild(c); }

      else n = inboxPending();

    b.onclick = () => { current = v.id; renderNav(); renderView(); window.scrollTo(0,0); };

async function setStatus(it, status){
  if (status === null) delete overrides[it.id];
  else overrides[it.id] = {status, note: effNote(it), at: new Date().toISOString()};
  renderNav(); renderView();
  await persist(status === null
    ? { kind: "del", path: `status/${it.id}` }
    : { kind: "set", path: `status/${it.id}`,
        data: { key: it.key, title: it.title, status,
                updatedAt: new Date().toISOString() } });
}

/* ---------- 图表 ---------- */
function scatter(pubs){
  const W=760, H=330, ML=52, MR=18, MT=16, MB=44;
  const iw = W-ML-MR, ih = H-MT-MB;
  const maxV = Math.max(...pubs.map(p=>p.views), 1);
  const maxR = Math.max(...pubs.map(p=>pctOf(p.collects,p.views)), 1);
  const yMax = Math.ceil(maxR);
  // 播放量长尾严重，用平方根标度铺开低值区；刻度标的是真实播放量
  const sx = v => ML + Math.sqrt(v/maxV)*iw;
  const sy = r => MT + ih - (r/yMax)*ih;

  // 刻度跟着最大值走：平方根标度上均匀取点，再取整到 1/2/5 开头的整数
  const nice = x => { if (x <= 0) return 0; const e = 10 ** Math.floor(Math.log10(x)), f = x / e;
                      return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e; };
  const base = [...new Set([0, .2, .45, .7].map(t => nice(maxV * t * t)))].filter(t => t <= maxV);
  // 末位刻度是真实最大值，离前一个太近就不画，否则两个数字叠在一起
  const xTicks = sx(maxV) - sx(base[base.length-1]) > 46 ? base.concat([Math.round(maxV)]) : base;
  const yTicks = Array.from({length:yMax+1},(_,i)=>i);

  let g = "";
  yTicks.forEach(t=>{
    g += `<line class="grid-line" x1="${ML}" y1="${sy(t)}" x2="${W-MR}" y2="${sy(t)}"/>`;
    g += `<text class="ax-t" x="${ML-9}" y="${sy(t)+3.5}" text-anchor="end">${t}%</text>`;
  });
  xTicks.forEach(t=>{
    g += `<text class="ax-t" x="${sx(t)}" y="${H-MB+17}" text-anchor="middle">${fmt(t)}</text>`;
  });
  g += `<line class="ax-line" x1="${ML}" y1="${MT+ih}" x2="${W-MR}" y2="${MT+ih}"/>`;
  g += `<text class="ax-title" x="${ML+iw/2}" y="${H-6}" text-anchor="middle">播放量</text>`;
  g += `<text class="ax-title" transform="translate(13,${MT+ih/2}) rotate(-90)" text-anchor="middle">收藏率</text>`;

  const pts = pubs.map((p,i)=>{
    const r = pctOf(p.collects,p.views);
    return `<circle class="pt" data-i="${i}" cx="${sx(p.views).toFixed(1)}" cy="${sy(r).toFixed(1)}"
      r="5.5" fill="${PLAT_COLOR[p.platform]}"/>`;
  }).join("");

  // 只给四个极值点直接标注，避免标签互相压
  const labeled = [...pubs].sort((a,b)=>b.views-a.views).slice(0,2)
    .concat([...pubs].sort((a,b)=>pctOf(b.collects,b.views)-pctOf(a.collects,a.views)).slice(0,2));
  const labs = [...new Set(labeled)].map(p=>{
    const r = pctOf(p.collects,p.views), x=sx(p.views), y=sy(r);
    const right = x < W/2;
    return `<text class="dlab" x="${(right?x+10:x-10).toFixed(1)}" y="${(y+3.5).toFixed(1)}"
      text-anchor="${right?"start":"end"}">${esc(cut(p.title,12))}</text>`;
  }).join("");

  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}"
    role="img" aria-label="播放量与收藏率散点图">${g}${pts}${labs}</svg></div>`;
}

function barList(rows, unit){
  const max = Math.max(...rows.map(r=>r.v), 0.001);
  return `<div class="bars">` + rows.map(r=>`
    <div class="brow">
      <div class="blab">${esc(r.label)}<em>${esc(r.sub)}</em></div>
      <div class="btrack"><div class="bfill" style="width:${(r.v/max*100).toFixed(1)}%;
        background:${r.color}"></div></div>
      <div class="bval">${r.v.toFixed(1)}${unit}</div>
    </div>`).join("") + `</div>`;
}

/* ---------- 长列表 ---------- */
const shown = {};          // 列表 id → 已点「显示全部」
const queries = {};        // 搜索框 id → 搜索词
let composing = false;     // 中文输入法组字时不重绘，否则会打断输入

/** 搜索框：输入即筛选。整页重绘后把焦点和光标放回去 */
function searchBox(id, placeholder){
  const q = el("input","search");
  q.placeholder = placeholder; q.value = queries[id] || ""; q.dataset.q = id;
  const apply = () => {
    queries[id] = q.value;
    renderView();
    const n = document.querySelector(`input[data-q="${id}"]`);
    if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  };
  q.addEventListener("compositionstart", () => { composing = true; });
  q.addEventListener("compositionend", () => { composing = false; apply(); });
  q.addEventListener("input", () => { if (!composing) apply(); });
  return q;
}
/** 搜索词为空，或任一字段包含搜索词 */
function matchQ(id, ...fields){
  const v = (queries[id] || "").trim().toLowerCase();
  return !v || fields.some(f => String(f || "").toLowerCase().includes(v));
}

/** 默认显示前 limit 条，底部「显示全部 N 条」；有搜索词时全部显示 */
function cappedRows(id, list, render, limit = 30, rows = el("div","rows")){
  const all = shown[id] || list.length <= limit || (queries[id] || "").trim();
  (all ? list : list.slice(0, limit)).forEach(x => rows.appendChild(render(x)));
  if (!all){
    const more = el("button","more-row", `显示全部 ${list.length} 条`);
    more.onclick = () => { shown[id] = true; renderView(); };
    rows.appendChild(more);
  }
  return rows;
}

/** 历次版本切换：较早 / 下拉选择 / 较新。versions 新的在前，[{key, label}] */
function versionPicker(versions, sel, pick){
  const box = el("span","ver");
  const i = Math.max(0, versions.findIndex(v => v.key === sel));
  const older = el("button","ver-b","‹");
  older.title = "较早的一份"; older.disabled = i >= versions.length - 1;
  older.onclick = () => { pick(versions[i + 1].key); renderView(); };
  const s = el("select","ver-s");
  s.setAttribute("aria-label", "选择版本");
  versions.forEach((v, j) => {
    const o = document.createElement("option");
    o.value = v.key; o.textContent = v.label + (j === 0 ? "（最新）" : "");
    o.selected = j === i;
    s.appendChild(o);
  });
  s.onchange = () => { pick(s.value); renderView(); };
  const sw = el("span","ver-sw"); sw.appendChild(s);
  const newer = el("button","ver-b","›");
  newer.title = "较新的一份"; newer.disabled = i <= 0;
  newer.onclick = () => { pick(versions[i - 1].key); renderView(); };
  box.appendChild(older); box.appendChild(sw); box.appendChild(newer);
  return box;
}

  if (T.other) notes.push(`<span class="r-p">${T.other} 条作品未归入任何方向</span>`);
  if (!T.categories.length && !run && !T.legacy) notes.push(`<span class="r-p">${

    if (!run && (T.pending || JOB.status === "error") && T.categories.length){

  return p;

/* ---------- 删除与撤销 ----------
   文件类（采集箱笔记、对标账号、自有内容分析、历史拆解报告）只在本地工作台能删：
   移进回收站，整页刷新拿新数据，撤销提示跨刷新保留。
   分析记录（拆解分析、选题推荐）存在数据库里，线上线下都能删，撤销就是写回去。 */
let toast = null;          // {text, undo, until, err}
let toastTimer = null;
const TOAST_MS = 10000;

function showToast(t){
  toast = t ? { ...t, until: t.until || Date.now() + TOAST_MS } : null;
  paintToast();
}

function paintToast(){
  document.querySelector(".toast")?.remove();
  clearTimeout(toastTimer);
  if (!toast || Date.now() >= toast.until){ toast = null; return; }
  const box = el("div","toast" + (toast.err ? " err" : ""));
  box.setAttribute("role","status");
  box.appendChild(el("span","", esc(toast.text)));
  if (toast.undo){
    const u = toast.undo;
    const b = el("button","","撤销");
    b.onclick = () => undoDelete(u);
    box.appendChild(b);
  }
  document.body.appendChild(box);
  toastTimer = setTimeout(() => { toast = null; box.remove(); }, toast.until - Date.now());
}

async function undoDelete(u){
  showToast(null);
  if (u.token){
    try { await apiOk("/api/restore", { method: "POST", body: JSON.stringify({ token: u.token }) }); }
    catch(e){ showToast({ text: "撤销失败：" + e.message, err: true }); return; }
    saveView(); location.reload();
    return;
  }
  if (u.analysis){
    const { key, data } = u.analysis;
    analyses[key] = data;
    saveLocal(); renderNav(); renderView();
    await persist({ kind: "set", path: `analyses/${key}`, data });
  }
}

/** 删除文件类条目，仅本地工作台 */
async function deleteFiles(kind, ids, text){
  try {
    const r = await apiOk("/api/delete", { method: "POST", body: JSON.stringify({ kind, ids }) });
    const { token } = await r.json();
    if (kind === "inbox") ids.forEach(id => picked.delete(id));
    toast = { text, undo: { token }, until: Date.now() + TOAST_MS };
    saveView(); location.reload();
  } catch(e){
    showToast({ text: "删除失败：" + e.message, err: true });
  }
}

/** 删除一份分析记录（拆解分析或选题推荐） */
async function deleteAnalysis(key){
  const data = analyses[key];
  if (!data) return;
  delete analyses[key];
  saveLocal(); renderNav(); renderView();
  showToast({ text: data.kind === "选题推荐" ? `已删除 ${stamp(data.createdAt)} 的选题推荐`
                                             : `已删除「${cut(data.title || data.kind, 20)}」`,
              undo: { analysis: { key, data } } });
  await persist({ kind: "del", path: `analyses/${key}` });
}

/** 删除按钮。hover = 只在鼠标移到所在行时显示 */
function delBtn(onClick, { hover = false, label = "删除", title = "" } = {}){
  const b = el("button", "del-b" + (hover ? " hov" : ""), label);
  if (title){ b.title = title; b.setAttribute("aria-label", title); }
  b.onclick = e => { e.stopPropagation(); onClick(); };
  return b;
}

function vOverview(){
  const w = document.createDocumentFragment();
  const works = items.filter(i=>i.track==="流水线");
  const drafts = items.filter(i=>i.track==="手写");

      side.appendChild(t); r.appendChild(side);
      rows.appendChild(r);
    });
    b.appendChild(rows); p.appendChild(b); w.appendChild(p);
  }

  const totalViews = pubs.reduce((a,p)=>a+p.views,0);
  const totalCollects = pubs.reduce((a,p)=>a+p.collects,0);
  const tiles = el("div","tiles");
  [[fmt(totalFans), "累计涨粉", "bad"],
   [(totalFans/totalViews*1000).toFixed(2)+"‰", "涨粉效率", ""],
   [(totalCollects/totalViews*100).toFixed(1)+"%", "收藏率", ""],
   [fmt(totalViews), "累计播放", ""],
  ].forEach(([n,l,c])=>tiles.appendChild(
    el("div","tile "+c, `<span class="n">${n}</span><span class="l">${l}</span>`)));
  w.appendChild(tiles);

  // 主力方向：选题报告的结论，写稿前最该记住的一句
  if (report && report.lead){
    const c = el("div","call");
    const lead = report.lead.replace(/^\*\*主力方向是「(.+?)」。\*\*\s*/, "**$1**　");
    c.innerHTML = `<h3>主力方向</h3>
      <p>${md(lead).replace(/^<p>|<\/p>\s*$/g,"")}</p>
      <p style="font-size:12.5px;color:var(--ink-3)">出自 ${esc(report.date)} 选题报告</p>`;

  const prows = el("div","rows");
  const perOf = name => { const a = pubs.filter(x => x.platform === name);
    const v = a.reduce((s,x)=>s+x.views,0); return v ? a.reduce((s,x)=>s+x.fans,0) / v * 1000 : 0; };
  const maxPer = Math.max(...DATA.platforms.map(pf => perOf(pf.name)), 0.001);
  DATA.platforms.filter(pf => pf.n).forEach(pf=>{
    const arr = pubs.filter(x=>x.platform===pf.name);
    const f = arr.reduce((a,x)=>a+x.fans,0), v = arr.reduce((a,x)=>a+x.views,0);
    const r = el("div","row"); r.style.gridTemplateColumns = "1fr 200px 128px";

    r.appendChild(el("div","meta-cell",

  // 最近发布：看最近做的东西成绩如何
  const recent = [...pubs].filter(p=>p.date)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,6);
  const rp = el("div","panel");
  rp.appendChild(el("div","panel-h", `<h2>最近发布</h2><span class="sub">最新 6 条</span>`));
  const rbo = el("div","panel-b flush");
  const rrows = el("div","rows");
  recent.forEach(p=>{
    const r = el("div","row"); r.style.gridTemplateColumns = "1fr 190px 104px";

    m.appendChild(el("div","r-t", esc(cut(p.title,42))));
    m.appendChild(el("span","r-p",
      `<span style="color:${PLAT_COLOR[p.platform]}">●</span> ${esc(p.platform)} · ${esc(p.date)}`));
    r.appendChild(m);
    r.appendChild(el("div","meta-cell",
      `<span>播放 ${fmt(p.views)}</span><span>收藏 ${p.collects}</span>${

    const t = el("span","stat-btn " + (p.fans && p.views && p.fans/p.views >= totalFans/totalViews ? "s-green"
                                       : p.fans>0 ? "s-amber" : "s-grey"));
    t.style.cursor="default";
    t.innerHTML = `<span class="dot"></span><span>+${p.fans} 粉</span>`;
    side.appendChild(t); r.appendChild(side);
    rrows.appendChild(r);
  });
  rbo.appendChild(rrows); rp.appendChild(rbo); w.appendChild(rp);

  // 对标近期：直接给行动线索
  if (B && B.candidates.length){
    const bp = el("div","panel");
    bp.appendChild(el("div","panel-h",
      `<h2>对标近期爆款</h2><span class="sub">更新于 ${esc(B.fetchedAt)}</span>`));

    const brows = el("div","rows");
    B.candidates.slice(0,4).forEach(n=>{
      const r = el("div","row"); r.style.gridTemplateColumns = "1fr 168px 96px";
      const m = el("div","r-main");
      const a = el("a","r-t r-link", esc(n.title));
      a.href = "https://www.xiaohongshu.com/search_result?keyword="
               + encodeURIComponent(Array.from(n.title).slice(0,30).join(""));
      a.target="_blank"; a.rel="noopener";
      m.appendChild(a);
      m.appendChild(el("span","r-p", `${esc(n.account)} · ${n.age} 天前`));

      const side = el("div","r-side");
      const t = el("span","stat-btn " + (n.ratio>=10 ? "s-red" : "s-amber"));
      t.style.cursor="default";
      t.innerHTML = `<span class="dot"></span><span>${n.ratio}×</span>`;

    });
    bb.appendChild(brows); bp.appendChild(bb); w.appendChild(bp);

  // 数据来源：每类数据读到了什么；本地工作台可以直接打开对应文件夹放文件
  const S = DATA.sources || [];
  if (S.length){
    const sp = el("div","panel");
    sp.appendChild(el("div","panel-h",
      `<h2>数据来源</h2><span class="sub">${LOCAL ? "文件夹内容变化后自动更新" : "本地工作台可打开对应文件夹"}</span>`));
    const sb = el("div","panel-b flush");
    const srows = el("div","rows");
    S.forEach(src=>{
      const r = el("div","row"); r.style.gridTemplateColumns = "1fr 120px";
      const m = el("div","r-main");
      m.appendChild(el("div","r-t", esc(src.label)));
      const info = src.kind === "export"
        ? (src.ready ? `最新导出 ${esc(src.date)} · ${fmt(src.count)} 条` : "尚无导出表格")
        : !src.ready ? "文件夹不存在"
        : src.kind === "drafts" ? `${fmt(src.count)} 篇` : `${fmt(src.count)} 期`;
      m.appendChild(el("span","r-p", info));
      r.appendChild(m);
      const side = el("div","r-side");
      if (LOCAL){
        const btn = el("button","tab","打开文件夹");
        btn.onclick = async ()=>{
          try {
            await apiOk("/api/open", { method: "POST", body: JSON.stringify({ key: src.key }) });
            btn.textContent = "已打开";
          } catch(e){ btn.textContent = "打开失败"; }
          setTimeout(()=>{ btn.textContent = "打开文件夹"; }, 2000);
        };
        side.appendChild(btn);

        const t = el("span","stat-btn " + (src.ready ? "s-green" : "s-grey"));
        t.style.cursor = "default";
        t.innerHTML = `<span class="dot"></span><span>${src.ready ? "已读取" : "未读取"}</span>`;
        side.appendChild(t);
      }
      r.appendChild(side);
      srows.appendChild(r);
    });
    sb.appendChild(srows); sp.appendChild(sb); w.appendChild(sp);
  }
  return w;
}

function vAnalytics(){
  const w = document.createDocumentFragment();
  const all = allPubs();
  const P = DATA.platforms.filter(p => p.n);

  w.appendChild(head("数据表现",
    `本账号 ${all.length} 条已发布内容的平台原始指标。收藏率反映沉淀意愿，涨粉效率反映转化质量。`));

  if (!all.length){
    const p = el("div","panel");
    p.appendChild(el("div","panel-b", `<div class="empty"><div class="eg">◱</div><h3>暂无平台数据</h3>
      <p>从创作者后台导出作品数据表格，放入总览「数据来源」中对应平台的文件夹。</p></div>`));
    w.appendChild(p); return w;
  }

  if (P.length >= 2){
    const [a, b] = [...P].sort((x, y) => y.views - x.views);
    const c = el("div","call info");
    c.innerHTML = `<h3>平台差异</h3>
      <p>${esc(a.name)}总播放为${esc(b.name)}的 <strong>${(a.views/b.views).toFixed(1)} 倍</strong>
         （${fmt(a.views)} / ${fmt(b.views)}）；${P.map(p => `${esc(p.name)}整体收藏率
         <strong>${pctOf(p.collects, p.views).toFixed(1)}%</strong>`).join("，")}。</p>
      <p>${P.length === 2 ? "两个" : "各"}平台的选题结论分别统计。</p>`;
    w.appendChild(c);
  }

  const sc = el("div","panel");
  sc.appendChild(el("div","panel-h",
    `<h2>播放量 × 收藏率</h2><span class="sub">每个点是一条已发布内容</span>`));
  const scb = el("div","panel-b");
  scb.innerHTML = scatter(all) +
    `<div class="legend2">
       ${P.map(p => `<span><i style="background:${PLAT_COLOR[p.name]}"></i>${esc(p.name)}</span>`).join("")}
       <span style="margin-left:auto;color:var(--ink-3);font-size:11px">
         右上 高曝光高沉淀 · 左上 低曝光高沉淀 · 右下 高曝光低沉淀</span>
     </div>`;
  sc.appendChild(scb); w.appendChild(sc);
  setTimeout(()=>attachScatterTips(scb, all), 0);

  const vs = all.map(p => p.views).sort((a,b) => a - b);
  const medV = vs.length ? vs[Math.floor(vs.length / 2)] : 0;
  const top = [...all].filter(p=>p.views>=medV && p.views>0)
    .sort((a,b)=>pctOf(b.collects,b.views)-pctOf(a.collects,a.views)).slice(0,10);
  const bp = el("div","panel");
  bp.appendChild(el("div","panel-h",
    `<h2>收藏率排行</h2><span class="sub">播放 ≥ ${fmt(medV)}（中位数）的内容</span>`));
  const bb = el("div","panel-b");
  bb.innerHTML = barList(top.map(p=>({
    label: cut(p.title,30), sub: `${p.platform} · ${fmt(p.views)} 播放 · +${p.fans} 粉`,
    v: pctOf(p.collects,p.views), color: PLAT_COLOR[p.platform]
  })), "%");
  bp.appendChild(bb); w.appendChild(bp);

  // 2s跳出率：只有部分平台的导出里有，反映开场前两秒能不能把人留住。
  // 题材能拉来播放，开场决定留不留得住，两者是分开的能力。
  const dy2 = all.filter(p => p.bounce2s);
  if (dy2.length){
    const sorted = [...dy2].sort((a,b)=>a.bounce2s-b.bounce2s);
    const medB = sorted[Math.floor(sorted.length/2)].bounce2s;
    const bp = el("div","panel");
    bp.appendChild(el("div","panel-h",
      `<h2>开场留存</h2><span class="sub">${esc([...new Set(dy2.map(p => p.platform))].join("、"))} 2s 跳出率 · ${dy2.length} 条 · 中位 ${(medB*100).toFixed(1)}%</span>`));
    const bb = el("div","panel-b");
    const best = sorted.slice(0,5), worst = sorted.slice(-5).reverse();
    bb.innerHTML =
      `<div style="font-size:12.5px;font-weight:600;margin:4px 0 10px">开场最稳</div>` +
      barList(best.map(p=>({
        label: cut(p.title,30),
        sub: `播放 ${fmt(p.views)} · 5s完播 ${p.finish5s ? (p.finish5s*100).toFixed(1)+"%" : "—"}`,
        v: p.bounce2s*100, color: "var(--ok)" })), "%") +
      `<div style="font-size:12.5px;font-weight:600;margin:18px 0 10px">开场漏人</div>` +
      barList(worst.map(p=>({
        label: cut(p.title,30),
        sub: `播放 ${fmt(p.views)} · 5s完播 ${p.finish5s ? (p.finish5s*100).toFixed(1)+"%" : "—"}`,
        v: p.bounce2s*100, color: "var(--accent)" })), "%") +
      `<div class="legend2" style="margin-top:14px">
         <span>数值越低越好，代表前两秒留住的人越多</span>
         <span style="margin-left:auto;color:var(--ink-3)">
           高播放 + 高跳出 = 题材拉来了人但开场没接住</span></div>`;
    bp.appendChild(bb); w.appendChild(bp);
  }

  w.appendChild(pubTable(all, P));
  return w;
}

function sortPubs(list){
  const col = PUB_COLS.find(c => c.k === pubSort.k) || PUB_COLS[3];
  const val = col.v || (p => p[col.k]);
  const empty = x => x === null || x === undefined || x === "";
  return [...list].sort((a, b) => {
    const x = val(a), y = val(b);
    if (empty(x) || empty(y)) return empty(x) - empty(y);
    return (col.num ? x - y : String(x).localeCompare(String(y), "zh")) * pubSort.d;
  });
}

/** 复盘爆款库：本地服务拼好提示词（稿件节选 + 数据 + 资产），交给本机 agent，结果先给用户确认 */
async function runRetro(){
  if (!sample || running || !LOCAL) return;
  let prompt = "";
  try {
    const r = await apiOk("/api/retro/prompt");
    prompt = (await r.json()).prompt;
  } catch(e){
    retroMsg = { done: [], errors: ["读取待回流作品失败：" + e.message] }; renderView(); return;
  }
  if (!prompt){ retroMsg = { done: [], errors: [], empty: true }; renderView(); return; }
  const ctrl = new AbortController();
  running = { key:"retro", text:"", kind:"复盘爆款库", title:`${DATA.retroPending} 条作品`,
              startedAt: Date.now(), ctrl };
  retroPlan = null; retroMsg = null;
  renderNav(); renderView(); startTick();
  try {
    const { text } = await sample(prompt, { modelTier:"complex", signal: ctrl.signal,
      onText: ({ text }) => { if (running) running.text = text; } });
    retroPlan = parsePlan(text);
    if (!retroPlan) retroMsg = { done: [], errors: ["复盘结果格式不对，可重新生成"] };
  } catch(e){
    retroMsg = { done: [], errors: ["复盘已中止"] };
  }
  stopTick(); running = null;
  renderNav(); renderView();
}

function parsePlan(text){
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try {
    const p = JSON.parse(text.slice(a, b + 1));
    return { records: (p.records || []).map(r => ({ ...r, on: true })),
             skips: (p.skips || []).map(k => ({ ...k, on: true })),
             newAssets: p.newAssets || [] };
  } catch(e){ return null; }
}

async function applyRetro(btn){
  const body = { records: retroPlan.records.filter(r => r.on), skips: retroPlan.skips.filter(k => k.on) };
  btn.disabled = true; btn.textContent = "写入中…";
  try {
    const r = await apiOk("/api/retro/apply", { method: "POST", body: JSON.stringify(body) });
    retroMsg = await r.json(); retroPlan = null;
  } catch(e){
    retroMsg = { done: [], errors: ["写入失败：" + e.message] };
  }
  saveView();          // 爆款库变了，页面会自动刷新；结果跟着保留
  renderView();
}

/** ISO 时间 → 本地「2026-10-08 17:30」 */
function stamp(iso){
  const d = new Date(iso || "");
  if (isNaN(d)) return (iso || "").slice(0, 16).replace("T", " ");
  const p2 = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

      unit: a.ids && a.ids.length>1 ? `${a.ids.length} 篇` : "单篇",
      partial:a.partial, markdown:a.markdown }));
  R.forEach((b,bi)=>{
    b.samples.forEach((sm,si)=>entries.push({
      key:`s_${bi}_${si}`, hide:`${b.name}|${sm.name}`, group:b.name, title:sm.name.replace(/^样本拆解\s*·\s*/,""),
      kind:"样本拆解", meta:b.generated||"", unit:`${sm.modules.length} 模块`,
      modules:sm.modules, sampleMeta:sm.meta, overview:b.overview, reportHtml:b.reportHtml }));
    if (b.common && b.common.length)
      entries.push({ key:`c_${bi}`, hide:`${b.name}|共性框架`, group:b.name, title:"共性框架", kind:"跨样本归纳",
                     meta:b.generated||"", unit:`${b.common.length} 节`, modules:b.common });
  });

  w.appendChild(head("拆解报告",
    `外部爆款的逐条内容拆解，共 ${entries.length} 份——拆到口播、结构与话术层面。选题层面的分析在选题报告。`));

  if (!entries.length){
    const p = el("div","panel");
    p.appendChild(el("div","panel-b","<div class=\"empty\"><p>暂无拆解报告</p></div>"));
    w.appendChild(p); return w;
  }
  if (!reportSel || !entries.some(e=>e.key===reportSel)) reportSel = entries[0].key;

  // 列表在左、正文在右；列表单独滚动，可按类型筛选和搜索
  const kinds = ["全部", ...new Set(entries.map(e => e.kind))];
  if (!kinds.includes(reportKind)) reportKind = "全部";
  const filtered = entries.filter(e => (reportKind === "全部" || e.kind === reportKind)
    && matchQ("reports", e.title, e.group, e.kind));

  const split = el("div","split");
  const lp = el("div","panel list-pane");
  lp.appendChild(el("div","panel-h", `<h2>报告</h2><span class="sub">${
    filtered.length === entries.length ? entries.length : `${filtered.length} / ${entries.length}`} 份</span>`));
  const tools = el("div","lp-tools");
  if (entries.length > 6) tools.appendChild(searchBox("reports", "搜索标题或批次…"));
  if (kinds.length > 2){
    const seg = el("div","seg");
    kinds.forEach(k => {
      const b = el("button", k === reportKind ? "on" : "", esc(k));
      b.onclick = () => { reportKind = k; renderView(); };
      seg.appendChild(b);
    });
    tools.appendChild(seg);
  }
  if (tools.children.length) lp.appendChild(tools);
  const rows = el("div","rows");
  filtered.forEach(e=>{
    const on = e.key===reportSel;
    const r = el("div","row selectable"+(on?" flag":""));
    r.tabIndex = 0;
    if (on) r.setAttribute("aria-current", "true");
    const open = ()=>{ reportSel = e.key; renderView(); };
    r.onclick = open;
    r.onkeydown = ev => { if (ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); open(); } };
    const m = el("div","r-main");
    m.appendChild(el("div","r-t", esc(e.title)));
    m.appendChild(el("span","r-p", [e.kind + (e.partial ? " · 未跑完" : ""), e.unit, e.group, e.meta]
      .filter(Boolean).map(esc).join(" · ")));
    r.appendChild(m);
    rows.appendChild(r);
  });
  if (!filtered.length) rows.appendChild(el("div","empty","<p>无匹配的报告</p>"));
  lp.appendChild(rows);
  split.appendChild(lp);
  w.appendChild(split);

  const cur = entries.find(e=>e.key===reportSel);
  if (!cur) return w;

  const dp = el("div","panel");
  const dh = el("div","panel-h",
    `<h2>${esc(cur.title)}</h2><span class="sub">${esc(cur.group)}${
      cur.meta ? " · "+esc(cur.meta) : ""}</span>`);
  if (cur.aKey && db) dh.appendChild(delBtn(() => deleteAnalysis(cur.aKey), { title: "删除这份报告" }));
  if (cur.hide && LOCAL) dh.appendChild(delBtn(() => deleteFiles("report", [cur.hide],
    `已删除「${cut(cur.title, 20)}」`), { title: "删除这份报告" }));
  dp.appendChild(dh);
  const db2 = el("div","panel-b");

  // 工作台分析：markdown 正文 + 导出
  if (cur.markdown !== undefined){
    if (downloads){
      const bar2 = el("div","bar");
      const ex = el("button", cur.savedAt ? "tab" : "tab on", cur.savedAt ? "已保存到爆款库 · 再次保存" : "↓ 保存到爆款库");
      ex.onclick = async ()=>{
        const rec = analyses[cur.aKey];
        const r = await exportAnalysis(rec);
        if (!r) return;
        ex.textContent = typeof r.added === "number"
          ? (r.added ? `已并入 ${r.added} 条` : "爆款库已有，未新增") : "已保存";
        ex.className = "tab";
        if (rec && !rec.savedAt){
          rec.savedAt = new Date().toISOString();
          saveLocal();
          await persist({ kind: "set", path: `analyses/${cur.aKey}`, data: rec });
        }
      };
      bar2.appendChild(ex);
      db2.appendChild(bar2);
    }
    const mw = el("div","mdwrap");
    mw.innerHTML = `<div class="md report">${md(cur.markdown)}</div>`;
    db2.appendChild(mw);
  }

  // 历史样本：批次概览表 + 样本元信息 + 模块折叠
  if (cur.modules){
    if (cur.overview && cur.overview.length){
      const ow = el("div","mdwrap");
      ow.innerHTML = `<table style="margin-bottom:16px"><thead><tr>
        <th>样本</th><th class="r">时长</th><th>类型</th><th>核心受众</th>
        <th>切口</th><th>最强可借点</th><th>主要短板</th></tr></thead><tbody>` +
        cur.overview.map(o=>`<tr>
          <td><strong>${esc(o.sample)}</strong></td><td class="r">${esc(o.duration)}</td>
          <td>${esc(o.kind)}</td><td>${esc(o.audience)}</td><td>${esc(o.angle)}</td>
          <td style="color:var(--ok)">${esc(o.borrow)}</td>
          <td style="color:var(--accent)">${esc(o.weakness)}</td></tr>`).join("") +
        `</tbody></table>`;
      db2.appendChild(ow);
    }
    if (cur.sampleMeta && cur.sampleMeta.length){
      const mt = el("div","smeta");
      cur.sampleMeta.forEach(x=>mt.appendChild(el("span","", esc(cut(x,72)))));
      db2.appendChild(mt);
    }
    const ctl = el("div","bar");
    const openAll = el("button","tab","展开全部");
    openAll.onclick = ()=>{ cur.modules.forEach((_,mi)=>openMods.add(`${cur.key}--${mi}`)); renderView(); };
    const closeAll = el("button","tab","收起全部");
    closeAll.onclick = ()=>{ cur.modules.forEach((_,mi)=>openMods.delete(`${cur.key}--${mi}`)); renderView(); };
    ctl.appendChild(openAll); ctl.appendChild(closeAll);
    db2.appendChild(ctl);
    cur.modules.forEach((mod,mi)=>db2.appendChild(moduleBlock(cur.key, "", mi, mod)));
  }
  dp.appendChild(db2); split.appendChild(dp);
  return w;
}


/* ---------- 内容采集箱 ---------- */
let sample = null;                    // claude.use("sample")，null = 不可用
const picked = new Set();             // 选中的笔记 id
const analyses = {};                  // 分析结果：key -> {kind,title,markdown,createdAt}
let running = null;                   // {key, text, kind, title, startedAt, ctrl}
let tickTimer = null;                 // 计时器，只刷新计时元素不整页重排
let inboxOpen = null;                 // 正在查看的分析 key
let inboxFilter = "全部";             // 采集箱列表的状态筛选
let downloads = null;                 // claude.use("downloads")，null = 不可用

/** 把一份分析存到下载目录。build_workbench 下次运行时 auto_merge 会并进资产总库。 */
async function exportAnalysis(rec){
  if (!downloads || !rec) return;
  const name = (rec.title || "分析").replace(/[\\/:*?"<>|]/g, "").slice(0, 40);
  try {
    return await downloads.save({
      filename: `xhs-analyses/${(rec.createdAt || "").slice(0,10)}-${name}.json`,
      data: JSON.stringify(rec, null, 2),
    });
  } catch(e){ return null; /* 用户取消保存是正常操作 */ }
}

const analysisKey = ids => ids.length === 1 ? `n_${ids[0]}` : `m_${keyId(ids.slice().sort().join("|"))}`;

/** 提示词模板在 prompts/*.md，页面和 agent 共用；{{名称}} 换成对应内容 */
const fill = (tpl, vars) => String(tpl || "").replace(/\{\{(\w+)\}\}/g,
  (m, k) => k in vars ? String(vars[k]) : m);

/** 单篇：按爆款解构框架逐维度拆 */
function promptSingle(n){
  return fill(DATA.prompts.single, {
    title: n.title, author: n.author, type: n.type, publishedAt: n.publishedAt || "未知",
    likes: n.likes, collects: n.collects, comments: n.commentCount,
    tags: n.tags.join(" ") || "无",
    content: n.transcript
      ? `【口播全文】（${n.transcriptLines} 句转写，${n.transcript.length} 字）\n${n.transcript}\n\n【笔记简介】\n${n.body || "(空)"}`
      : `【正文】\n${n.body || "(正文为空)"}`,
    topComments: n.topComments.map(c => `- ${c.author}（${c.likes}赞）：${c.text}`).join("\n") || "(未采集到)",
    transcriptNote: n.needsTranscript ? "\n注意：这是视频笔记，上面只有简介，没有口播全文。凡是需要口播才能下的判断，请标注「需转写后才能判断」，不要臆测。" : "",
  });
}

/** 多篇：找共性，共性才是可复用的框架 */
function promptMulti(list){
  const samples = list.map((n, i) => `
【样本 ${i+1}】${n.title}
体裁 ${n.type} · 赞 ${n.likes} · 藏 ${n.collects} · 评 ${n.commentCount}
话题：${n.tags.join(" ") || "无"}
${n.transcript ? "口播全文：" : "正文："}
${(n.transcript || n.body || "(空)").slice(0, 2500)}
热门评论：${n.topComments.slice(0,6).map(c=>c.text).join(" / ") || "(未采集)"}
`).join("\n---\n");
  return fill(DATA.prompts.multi, { count: list.length, samples });
}

async function runAnalysis(){
  const list = (DATA.inbox || []).filter(n => picked.has(n.id));
  if (!list.length || running) return;
  const ids = list.map(n => n.id);
  const key = analysisKey(ids);
  const kind = list.length === 1 ? "单篇爆款分析" : `${list.length} 篇结构共性分析`;
  const title = list.length === 1 ? list[0].title
              : list.map(n => n.title).join(" + ");

  const ctrl = new AbortController();
  running = { key, text: "", kind, title, startedAt: Date.now(), ctrl };
  inboxOpen = key;
  renderNav(); renderView(); startTick();

  try {
    const input = list.length === 1 ? promptSingle(list[0]) : promptMulti(list);
    const { text } = await sample(input, {
      modelTier: "complex",
      signal: ctrl.signal,
      onText: ({ text }) => { if (running) { running.text = text; paintRunning(); } },
    });
    const rec = { kind, title, markdown: text, ids,
                  createdAt: new Date().toISOString() };
    analyses[key] = rec;
    stopTick(); running = null;
    current = "reports";        // 结果归拆解报告，采集箱只管队列
    reportSel = "a_" + key;
    renderNav(); renderView();
    saveLocal();
    await persist({ kind: "set", path: `analyses/${key}`, data: rec });
  } catch (e) {
    // 部分结果也值得留在屏幕上，别让用户白等一场
    const partial = e && e.text;
    const aborted = e && e.code === "cancelled";
    stopTick(); running = null;
    if (aborted){ renderNav(); renderView(); return; }
    if (partial) analyses[key] = { kind, title, markdown: partial, ids, partial: true,
                                   createdAt: new Date().toISOString() };
    else alert(e && e.code === "not_granted"
      ? "分析未获授权，未执行。"
      : `分析失败：${(e && e.message) || e}`);
    renderView();
  }
}

function elapsed(){
  return running ? Math.round((Date.now() - running.startedAt) / 1000) : 0;
}

/** 计时和字数每秒刷新，只动这几个节点，不整页重排 */
function startTick(){
  stopTick();
  tickTimer = setInterval(()=>{
    document.querySelectorAll("[data-elapsed]").forEach(e =>
      e.textContent = `${elapsed()}s`);
    const rc = document.getElementById("rcStage");
    if (rc && running) rc.textContent = running.text
      ? `${running.text.length} 字` : "等待响应";
    const st = document.getElementById("runStage");
    if (st && running) st.textContent = running.text
      ? `正在生成 · ${running.text.length} 字`
      : "已提交，等待模型响应";
  }, 1000);
}
function stopTick(){ if (tickTimer){ clearInterval(tickTimer); tickTimer = null; } }

/** 流式输出时只重绘正文，不整页重排 */
function paintRunning(){
  const t = document.getElementById("runText");
  if (t && running) t.innerHTML = md(running.text);
}

/** 侧边栏常驻指示：任何视图下都能看到分析在跑 */
function runningCard(){
  if (!running) return null;
  const c = el("div","runcard");
  c.innerHTML = `
    <div class="rc-h"><span class="rc-dot"></span>分析进行中</div>
    <div class="rc-t">${esc(cut(running.title,26))}</div>
    <div class="rc-m"><span id="rcStage">${running.text
      ? `${running.text.length} 字` : "等待响应"}</span><span data-elapsed>${elapsed()}s</span></div>`;
  const stop = el("button","rc-stop","中止");
  stop.onclick = e => { e.stopPropagation(); running.ctrl.abort(); };
  c.appendChild(stop);
  const home = {"选题推荐":"topics", "复盘爆款库":"library"}[running.kind] || "inbox";
  c.onclick = ()=>{ if (current !== home){ current = home; renderNav(); renderView(); } };
  return c;
}

async function runTopicRec(){
  if (!sample || running) return;
  const B = DATA.benchmark.summary;
  // 每次生成单独一份，历史记录里都能看到
  const key = "topics_" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15);
  const ctrl = new AbortController();
  running = { key, text:"", kind:"选题推荐", title:`基于 ${B.accounts.length} 个对标账号`,
              startedAt: Date.now(), ctrl };
  topicTab = "选题推荐";
  renderNav(); renderView(); startTick();
  try {

      modelTier: "complex", signal: ctrl.signal,
      onText: ({ text }) => { if (running) { running.text = text; paintRunning(); } },
    });

                  ids: [key], createdAt: new Date().toISOString() };

}

/** 粉丝数：纯数字超过一万写成「24.0万」，平台已经给了「1.2万」这类写法就原样显示 */
function fansText(v){
  const n = Number(String(v ?? "").replace(/,/g, ""));
  if (!String(v ?? "").trim() || isNaN(n)) return String(v ?? "—");
  return n >= 10000 ? (n / 10000).toFixed(1) + "万" : fmt(n);
}

    .sort((a,b) => a.age - b.age || b.likes - a.likes);

  const hotAll = (B.notes || []).filter(n => n.age <= RD && n.ratio >= 2.5).length;

      m.appendChild(el("span","r-perf", n.tags.map(t=>"#"+esc(t)).join(" ")));

      `<span>赞 ${fmt(n.likes)}</span>
       <span style="color:var(--ink-3)">该账号中位 ${fmt(n.accountMedian)}</span>`));

    const t = el("span","stat-btn " + (n.ratio>=10 ? "s-red" : n.ratio>=5 ? "s-amber" : n.ratio>=2.5 ? "s-green" : "s-grey"));
    t.style.cursor="default";

  };

  if (benchTab === "近期爆款" || benchTab === "更早的高表现"){

    const p = el("div","panel");
    p.appendChild(el("div","panel-h",
      `<h2>${benchTab}</h2>
       <span class="sub">${benchTab==="近期爆款"
         ? (hotAll > list.length ? `近 ${RD} 天倍数 ≥ 2.5 的 ${hotAll} 条中，倍数最高的 ${list.length} 条`
                                 : `近 ${RD} 天倍数 ≥ 2.5 的笔记，共 ${list.length} 条`)
         : `${RD} 天以前倍数 ≥ 3 的笔记中，倍数最高的 ${list.length} 条`} · 倍数 = 该笔记点赞 ÷ 发布账号自己的点赞中位数</span>`));
    const b = el("div","panel-b flush");
    const rows = el("div","rows");
    const hot = benchTab === "近期爆款";
    if (hot && list.some(n => !seenHot.has(hotKey(n)))){
      list.forEach(n => { if (!seenHot.has(hotKey(n))){ freshHot.add(hotKey(n)); seenHot.add(hotKey(n)); } });
      saveLocal();
    }
    list.forEach(n=>rows.appendChild(noteRow(n, hot, hot && freshHot.has(hotKey(n)))));
    b.appendChild(rows); p.appendChild(b); w.appendChild(p);

    const tip = el("div","call");
    tip.innerHTML = `<h3>下一步</h3>
      <p>点击标题跳转小红书搜索，打开笔记后用采集插件采集，可在采集箱做结构共性分析。</p>`;
    w.appendChild(tip);
  }

  if (benchTab === "最新发布"){
    const p = el("div","panel");
    p.appendChild(el("div","panel-h",
      `<h2>最新发布</h2><span class="sub">近 ${LATEST_DAYS} 天 · 按发布时间排序 · 点赞为最近一次采集时的数值</span>`));
    const b = el("div","panel-b flush");
    if (latest30.length){

      latest30.forEach(n=>rows.appendChild(noteRow(n, true)));

      b.appendChild(el("div","empty", `<p>近 ${LATEST_DAYS} 天无新笔记</p>`));

  if (benchTab === "标题模式"){
    const p = el("div","panel");
    p.appendChild(el("div","panel-h",
      `<h2>标题模式</h2><span class="sub">${B.patternDays ? `近 ${B.patternDays} 天的笔记` : "全部笔记"} · 中位 ${

    })), "x");

    p.appendChild(b); w.appendChild(p);

  // 抓取历史
  if (hist.length > 1){

      `<h2>更新记录</h2><span class="sub">${hist.length} 次</span>`));

    hp.appendChild(hb); w.appendChild(hp);
  }
  return w;
}

    w.appendChild(p);
  }

  return w;

/* ---------- 自动刷新（本地服务） ---------- */
const VIEW_KEY = "workbench.view";

function saveView(){
  try {
    sessionStorage.setItem(VIEW_KEY, JSON.stringify({ current, reportSel, reportKind, topicTab, topicSel, ownSel,
      benchTab, inboxOpen, inboxFilter, wipFilter, libFilter, shown, queries, retroMsg, pubSort, pubPlat,
      toast: toast && Date.now() < toast.until ? toast : null, openAssets: [...openAssets],
      picked: [...picked], y: scrollY }));
  } catch(e){ /* 存不了就回到总览，不影响使用 */ }
}

function restoreView(){
  try {
    const v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null");
    sessionStorage.removeItem(VIEW_KEY);
    if (!v) return 0;
    ({ current, reportSel, reportKind = "全部", topicTab, topicSel, ownSel, benchTab, inboxOpen,
       inboxFilter = "全部", wipFilter, libFilter, retroMsg = null, pubSort = { k: "views", d: -1 },
       pubPlat = "全部", toast = null } = v);
    (v.openAssets || []).forEach(k => openAssets.add(k));
    Object.assign(shown, v.shown || {}); Object.assign(queries, v.queries || {});
    (v.picked || []).forEach(id => picked.add(id));
    return v.y || 0;
  } catch(e){ return 0; }
}

/** 正在分析、菜单打开或正在输入时先不刷新，等下一轮 */
function busy(){
  const a = document.activeElement;
  return running || $("#menu").classList.contains("on")
      || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}

if (LOCAL){
  setInterval(async () => {
    if (document.hidden || busy()) return;
    try {
      const r = await api("/api/version");
      // 403 = 服务换过口令（重装或清过本地数据），重新加载拿新的
      if (r.status === 403){ saveView(); location.reload(); return; }
      if (!r.ok) return;
      const { version } = await r.json();
      if (version !== DATA.version){ saveView(); location.reload(); }
    } catch(e){ /* 本机服务停了就保持当前页面 */ }
  }, 5000);
}

  dbReady = true;
  if (!db){ updateSync(); renderView(); return; }
  await flushQueued();           // 把本地攒下的改动补进远端
  try {
    const snap = await db.collection("status").get();
    (snap.docs || []).forEach(doc => {
      const v = doc.data && doc.data();
      if (!v || !v.status) return;
      // 文档里存了原始 key，用它重算 id —— 这样即使快照结构变化也能对上
      overrides[v.key ? keyId(v.key) : doc.id] = {status: v.status, note: v.note, at: v.updatedAt};
    });
    saveLocal();
  } catch(e){
    // 读不回来就会显示成推断值，必须让用户看见，否则以为改动丢了
    saveError = "读取失败：" + ((e && (e.message || e.code)) || e);
  }
  try {
    const snap = await db.collection("analyses").get();
    const inDb = new Set();
    (snap.docs || []).forEach(doc => {
      const v = doc.data && doc.data();
      // 用文档 id 作 key：写入时就是按这个 id 存的，重算会对不上而产生重复
      if (v && v.markdown && v.ids){ analyses[doc.id] = v; inDb.add(doc.id); }
    });
    // 上次在数据库里见过、这次没有了：在别处删掉了。从没进过数据库的（只存在本机）保留
    const queued = new Set(queuedOps.filter(o => o.kind === "set").map(o => o.path.replace(/^analyses\//, "")));
    Object.keys(analyses).forEach(k => {
      if (!inDb.has(k) && dbKeys.has(k) && !queued.has(k)) delete analyses[k];
    });
    dbKeys.clear(); inDb.forEach(k => dbKeys.add(k));
    saveLocal();
  } catch(e){ /* 历史分析读不到不影响状态，静默降级 */ }
  updateSync();
  renderNav(); renderView();
})();

// 分析能力单独接：它和存储互不依赖，一个不可用不该拖垮另一个
(async () => {
  try { sample = LOCAL ? localSample : await claude.use("sample"); }
  catch(e){ sample = null; }
  try { downloads = LOCAL ? localDownloads : await claude.use("downloads"); }
  catch(e){ downloads = null; }
  if (current === "inbox") renderView();
})();
</script>
